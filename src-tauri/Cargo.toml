[package]
name = "director-desktop"
version = "0.1.0"
description = "Director — WM Studio's creative production agent, on the desktop."
authors = ["WM Studio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "director_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS-native secret storage: macOS Keychain + Windows Credential Manager.
# keyring 3.x makes the platform stores opt-in via features.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
